name: Build and Publish CodeServer Image

on:
  # 1. 每周一定时自动运行 (UTC 00:00，相当于北京时间周一上午 08:00)
  schedule:
    - cron: "0 0 * * 1"

  # 2. 手动点击按钮触发
  workflow_dispatch:

  # 3. 当 Dockerfile.CodeServer 或本工作流有改动时也触发
  push:
    paths:
      - "Dockerfile.CodeServer"
      - ".github/workflows/code-server-image.yml"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    # 给 GHCR 开启镜像写入权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # 开启 Docker Buildx 支持（用于 BuildKit 缓存挂载等特性）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. 登录 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 一次性构建并推送至两个仓库，标签固定为 Debian-CodeServer
      #    - 加日期标签便于追踪每周构建产物
      - name: Set build date
        id: date
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Build and Publish the CodeServer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.CodeServer
          push: true
          tags: |
            767939287/code-server:latest
            767939287/code-server:${{ steps.date.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/code-server:latest
            ghcr.io/${{ github.repository_owner }}/code-server:${{ steps.date.outputs.date }}
          # 启用 GitHub Actions 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
