name: Build and Publish Docker Image

on:
  # 1. 代码推送触发
  # push:
  #   branches: [ "main" ]
  # # 2. Pull Request 触发
  # pull_request:
  #   branches: [ "main" ]
  
  # 3. 每周一定时自动运行 (UTC 时间 00:00，相当于北京时间周一上午 08:00)
  schedule:
    - cron: "0 0 * * 1"

  # 4. 手动点击按钮触发
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    # 给 GHCR 开启镜像写入权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # 开启 Docker Buildx 支持
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. 登录 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 一次性构建并推送至两个仓库
      - name: Build and Publish the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 在 tags 中同时指定 Docker Hub 和 GHCR 的镜像地址
          tags: |
            767939287/ubuntu-desktop:latest
            ghcr.io/${{ github.repository_owner }}/ubuntu-desktop:latest
          # 启用 GitHub Actions 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max